# ==============================================================================
# Sovereign 2026 Minimal Tmux Configuration
# Philosophy: Universal defaults (Ctrl-b), zero plugin bloat, 1-based indexing
# ==============================================================================

# Ensure default shell is Bash
set -g default-shell /bin/bash

# True Color & Terminal Support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -gq allow-passthrough on

# Modern Terminal Clipboard Support (OSC 52)
# Works across Wayland, X11, WSL, and SSH without external dependencies
set -s set-clipboard on

# Fast response time (no delay for Vim Escape)
set -s escape-time 0
set -g history-limit 50000

# 1-based indexing for natural keyboard ergonomics (1..9 from left to right)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Mouse support enabled for quick scrolling & clicking
set -g mouse on

# ==============================================================================
# Clipboard & Copy Mode (Vi Keybindings)
# ==============================================================================
setw -g mode-keys vi

# Start selection with 'v' or 'Space'
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi C-v send-keys -X rectangle-toggle

# Yank with 'y' or 'Enter' directly to System Clipboard
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || cat"
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || cat"

# Mouse drag-to-copy directly to System Clipboard
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -in -selection clipboard 2>/dev/null || cat"

# Quick paste shortcut inside tmux
bind P paste-buffer

# ==============================================================================
# Navigation & Status Bar
# ==============================================================================
# Pane navigation with Vi keys (in addition to default arrows)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Clean, distraction-free status bar at the top
set -g status-position top
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"
set -g status-left-length 40
set -g status-left "#[fg=#89b4fa,bold]  [#S] #[default]"
set -g status-right-length 60
set -g status-right "#[fg=#a6adc8] %H:%M | %d-%b-%y "

setw -g window-status-current-style "fg=#11111b,bg=#89b4fa,bold"
setw -g window-status-current-format " #I: #W "
setw -g window-status-format " #I: #W "
set -g pane-active-border-style "fg=#89b4fa"
set -g pane-border-style "fg=#313244"
